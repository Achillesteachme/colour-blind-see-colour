<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="pupilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00000022"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="#FFFFFF"/>

  <!-- Eye sclera — centred, slightly taller -->
  <ellipse cx="512" cy="512" rx="360" ry="230" fill="#F5F4FA" filter="url(#shadow)"/>

  <!-- Colour rings — outside in -->
  <ellipse cx="512" cy="512" rx="258" ry="165" fill="#3B82F6"/>
  <ellipse cx="512" cy="512" rx="225" ry="144" fill="#F59E0B"/>
  <ellipse cx="512" cy="512" rx="192" ry="123" fill="#22C55E"/>
  <ellipse cx="512" cy="512" rx="159" ry="102" fill="#EF4444"/>
  <ellipse cx="512" cy="512" rx="126" ry="81"  fill="#7B61FF"/>

  <!-- Pupil -->
  <circle cx="512" cy="512" r="76" fill="url(#pupilGrad)"/>

  <!-- Pupil shine -->
  <ellipse cx="490" cy="493" rx="19" ry="14" fill="white" opacity="0.65"/>
  <ellipse cx="532" cy="528" rx="9" ry="7"  fill="white" opacity="0.28"/>

  <!-- UPPER EYELASHES — 7 lashes fanning outward from top lid curve -->
  <g stroke="#1A1A2E" stroke-linecap="round" fill="none">
    <!-- Far left -->
    <line x1="222" y1="472" x2="192" y2="418" stroke-width="9"/>
    <!-- Left -->
    <line x1="300" y1="393" x2="278" y2="334" stroke-width="9"/>
    <!-- Left-centre -->
    <line x1="400" y1="339" x2="388" y2="276" stroke-width="10"/>
    <!-- Centre -->
    <line x1="512" y1="322" x2="512" y2="256" stroke-width="11"/>
    <!-- Right-centre -->
    <line x1="624" y1="339" x2="636" y2="276" stroke-width="10"/>
    <!-- Right -->
    <line x1="724" y1="393" x2="746" y2="334" stroke-width="9"/>
    <!-- Far right -->
    <line x1="802" y1="472" x2="832" y2="418" stroke-width="9"/>
  </g>

  <!-- LOWER EYELASHES — 5 shorter lashes -->
  <g stroke="#1A1A2E" stroke-linecap="round" fill="none">
    <line x1="320" y1="626" x2="300" y2="672" stroke-width="7"/>
    <line x1="420" y1="668" x2="410" y2="716" stroke-width="7"/>
    <line x1="512" y1="682" x2="512" y2="732" stroke-width="7"/>
    <line x1="604" y1="668" x2="614" y2="716" stroke-width="7"/>
    <line x1="704" y1="626" x2="724" y2="672" stroke-width="7"/>
  </g>

  <!-- Eye outline for crispness -->
  <path d="M 152 512 Q 512 248 872 512 Q 512 776 152 512 Z"
    fill="none" stroke="#1A1A2E" stroke-width="7" opacity="0.12"/>

</svg>